<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Started | Worn</title>
<meta name="description" content="Worn lets you try on clothes before you buy them with an AI rendering on your own body.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600&family=Yellowtail&display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#1A1A1A}a:hover{color:#000000}
.profile-tip{position:absolute;top:calc(100% + 8px);right:0;white-space:nowrap;padding:6px 10px;background:#1A1A1A;color:#F6F2EA;font-family:'Inter Tight',system-ui,sans-serif;font-size:0.8rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s,transform .15s;z-index:2}
.profile-btn:hover .profile-tip,.profile-btn:focus-visible .profile-tip{opacity:1;transform:translateY(0)}
.ed-link{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .25s}
.ed-link:hover,.ed-link:focus-visible{background-size:100% 1px}
.ed-btn{transition:background-color .2s,border-color .2s;outline:2px solid transparent;outline-offset:4px}
.ed-btn:hover{background-color:#8A5A2B !important;border-color:#8A5A2B !important}
.ed-btn:focus-visible{outline-color:#1A1A1A}
.ed-field{transition:border-color .2s}
.ed-field:focus{outline:none;border-bottom-color:#8A5A2B !important;box-shadow:0 1px 0 0 #8A5A2B}
@media (prefers-reduced-motion: reduce){.ed-link,.ed-btn,.ed-field{transition:none}}
@media (max-width: 640px){.masthead{grid-template-columns:1fr auto !important;row-gap:0 !important}.masthead .wordmark{grid-column:1 / -1;grid-row:1}}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #F6F2EA; color: #1A1A1A; font-family: 'Inter Tight', system-ui, sans-serif">

<header style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 16px 32px 0">
<div class="masthead" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; gap: 12px; padding-bottom: 14px">
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 20px">
<a href="index.html" class="ed-link" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #1A1A1A">Home</a>
</nav>
<a href="index.html" aria-label="Worn home" class="wordmark" style="justify-self: center; display: inline-flex; align-items: center; min-height: 44px; color: #1A1A1A; text-decoration: none; font-family: 'Yellowtail', cursive; font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1">Worn</a>
<div style="justify-self: end; display: flex; align-items: center; gap: 16px">
<a href="get-started.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #8A5A2B; text-decoration: underline; text-underline-offset: 6px">Get Started</a>
<a href="profile.html" class="profile-btn" aria-label="My Profile" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #1A1A1A; border-radius: 999px; color: #1A1A1A; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
<span class="profile-tip" aria-hidden="true">My Profile</span>
</a>
</div>
</div>
<div style="border-top: 1px solid #1A1A1A; border-bottom: 1px solid #1A1A1A; height: 3px"></div>
</header>

<main style="max-width: 640px; margin: 0 auto; box-sizing: border-box; padding: clamp(48px, 7vw, 96px) 32px clamp(64px, 8vw, 112px); display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
<p style="margin: 0; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #8A5A2B">Step 1 of 2</p>
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: clamp(3rem, 7vw, 5.4rem); line-height: 1; letter-spacing: -0.015em">Get <em>Started</em></h1>
<div style="width: 64px; height: 1px; background: #1A1A1A"></div>
<p style="margin: 0; max-width: 520px; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: clamp(1.15rem, 1.7vw, 1.35rem); line-height: 1.5; color: #2B2722">Tell us a little about yourself so Worn can show you how clothes will fit.</p>

<form id="signup-form" style="margin: 32px 0 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 40px">
<section style="width: 100%; box-sizing: border-box; padding: clamp(28px, 4vw, 44px); border: 1px solid #1A1A1A; background: #FBF8F2; text-align: left; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid rgba(26, 26, 26, 0.18)">
<h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: clamp(1.8rem, 3vw, 2.4rem); line-height: 1.1">About You</h2>
<span style="font-size: 0.75rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #8A5A2B">No. 01</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 26px 24px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">First name<input class="ed-field" type="text" name="firstName" required autocomplete="given-name" style="min-height: 44px; box-sizing: border-box; padding: 0 2px; border: 0; border-bottom: 1px solid #1A1A1A; background: transparent; color: #1A1A1A; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.2rem; letter-spacing: 0; text-transform: none"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">Last name<input class="ed-field" type="text" name="lastName" autocomplete="family-name" style="min-height: 44px; box-sizing: border-box; padding: 0 2px; border: 0; border-bottom: 1px solid #1A1A1A; background: transparent; color: #1A1A1A; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.2rem; letter-spacing: 0; text-transform: none"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">Email<input class="ed-field" type="email" name="email" required autocomplete="email" placeholder="you@example.com" style="min-height: 44px; box-sizing: border-box; padding: 0 2px; border: 0; border-bottom: 1px solid #1A1A1A; background: transparent; color: #1A1A1A; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.2rem; letter-spacing: 0; text-transform: none"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">Create password<span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 0.95rem; font-style: italic; font-weight: 400; letter-spacing: 0; text-transform: none; color: #5A544C">At least 8 characters</span><input class="ed-field" type="password" name="password" required autocomplete="new-password" minlength="8" id="password" style="min-height: 44px; box-sizing: border-box; padding: 0 2px; border: 0; border-bottom: 1px solid #1A1A1A; background: transparent; color: #1A1A1A; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.2rem; letter-spacing: 0; text-transform: none"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">Confirm password<input class="ed-field" type="password" name="confirmPassword" required autocomplete="new-password" minlength="8" id="confirm" aria-describedby="pw-status" style="min-height: 44px; box-sizing: border-box; padding: 0 2px; border: 0; border-bottom: 1px solid #1A1A1A; background: transparent; color: #1A1A1A; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.2rem; letter-spacing: 0; text-transform: none"></label>
<div id="pw-status" aria-live="polite" style="min-height: 22px; margin-top: -12px; font-size: 0.95rem; font-weight: 600"></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">Preferred clothing fit<select class="ed-field" name="fit" style="min-height: 44px; box-sizing: border-box; padding: 0 2px; border: 0; border-bottom: 1px solid #1A1A1A; background: transparent; color: #1A1A1A; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.2rem; letter-spacing: 0; text-transform: none"><option>Regular</option><option>Slim</option><option>Relaxed</option><option>Oversized</option></select></label>
</section>
<button type="submit" id="signup-btn" class="ed-btn" style="display: inline-flex; align-items: center; gap: 12px; min-height: 60px; box-sizing: border-box; padding: 0 40px; border: 1px solid #1A1A1A; background: #1A1A1A; color: #F6F2EA; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer">Save &amp; Continue
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"></path><path d="M14 6l6 6-6 6"></path></svg>
</button>
<p id="form-msg" role="status" aria-live="polite" style="margin: -16px 0 0; min-height: 24px; max-width: 520px; text-align: center; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.05rem"></p>
<p style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.05rem; color: #5A544C">Already have an account? <a href="login.html?next=checkout.html" style="color: #8A5A2B; font-weight: 600; text-underline-offset: 4px">Log in</a></p>
</form>
</main>

<footer style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 0 32px">
<div style="border-top: 1px solid #1A1A1A; padding: 28px 0 36px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<span style="font-family: 'Yellowtail', cursive; font-size: 2.2rem; line-height: 1">Worn</span>
<span style="font-size: 0.8rem; letter-spacing: 0.16em; text-transform: uppercase; color: #5A544C">Dean Nguyen · © 2026</span>
</div>
</footer>
</div>
<script>
  // Live check that the two password fields match.
  (function () {
    var pw = document.getElementById('password');
    var cf = document.getElementById('confirm');
    var out = document.getElementById('pw-status');
    var check = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';
    var cross = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>';
    function show(color, icon, text) {
      out.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px;color:' + color + '">' + icon + text + '</span>';
    }
    function update() {
      var a = pw.value, b = cf.value;
      if (a.length > 0 && a.length < 8) show('#8A1F14', cross, 'Password must be at least 8 characters');
      else if (b.length === 0) out.innerHTML = '';
      else if (a === b) show('#2F5D3A', check, 'Passwords match');
      else show('#8A1F14', cross, "Passwords don't match");
    }
    pw.addEventListener('input', update);
    cf.addEventListener('input', update);
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  // Create a real account with Supabase.
  (function () {
    var form = document.getElementById('signup-form');
    var btn = document.getElementById('signup-btn');
    var msg = document.getElementById('form-msg');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!window.worn) { msg.style.color = '#8A1F14'; msg.textContent = "Sign-up couldn't load (the site's js files are missing). Please try again later."; return; }
      var f = form.elements;
      if (f.password.value.length < 8) return worn.say(msg, 'Your password needs at least 8 characters.', 'error');
      if (f.password.value !== f.confirmPassword.value) return worn.say(msg, "Your passwords don't match.", 'error');
      if (!worn.ready) return worn.say(msg, worn.notReadyMessage, 'error');
      btn.disabled = true; btn.style.opacity = '0.6';
      worn.say(msg, 'Creating your account…', 'info');
      try {
        var res = await worn.client.auth.signUp({
          email: f.email.value.trim(),
          password: f.password.value,
          options: {
            data: { first_name: f.firstName.value.trim(), last_name: f.lastName.value.trim(), preferred_fit: f.fit.value },
            emailRedirectTo: location.origin + '/checkout.html'
          }
        });
        if (res.error) throw res.error;
        if (res.data.session) {
          location.href = 'checkout.html';
        } else {
          worn.say(msg, 'Almost done! We sent a confirmation link to ' + f.email.value.trim() + '. Click it to confirm your email, then you\'ll choose your plan.', 'ok');
          form.reset();
        }
      } catch (err) {
        worn.say(msg, worn.friendlyError(err), 'error');
      } finally {
        btn.disabled = false; btn.style.opacity = '';
      }
    });
  })();
</script>
</body>
</html>
