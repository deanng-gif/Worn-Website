<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile | Worn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,700;1,400&family=Sora:wght@600;700&family=Yellowtail&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main style="justify-content: flex-start">
  <nav aria-label="Main">
    <a href="index.html" class="home-btn">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path><path d="M10 20v-6h4v6"></path></svg>
      <span>Worn</span>
    </a>
  </nav>
  <a href="profile.html" class="profile-btn current" aria-label="My Profile" aria-current="page">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
    <span class="profile-tip" aria-hidden="true">My Profile</span>
  </a>

  <div class="avatar" aria-hidden="true">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
  </div>
  <h1 class="page-title">My Profile</h1>
  <p class="name" style="margin-top: -4px">Dean Nguyen</p>
  <a href="#" class="btn-outline">Edit profile</a>
  <div class="rule-wide" style="margin-top: 24px"></div>

  <div class="two-col">
    <section>
      <h2>My Photos</h2>
      <div class="panel ring">
        <div class="slots3">
          <div class="slot">[Front]</div>
          <div class="slot">[Side]</div>
          <div class="slot">[Back]</div>
        </div>
        <button type="button" class="btn-dark">Upload photos</button>
      </div>
    </section>
    <section>
      <h2>Body Details</h2>
      <form class="panel ring" style="margin: 0">
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
          <legend style="padding: 0; margin-bottom: 6px; font-weight: 600">Height</legend>
          <div class="row2">
            <label class="field" style="font-weight: 400; font-size: 0.9rem">Feet<input type="number" min="3" max="8" placeholder="5"></label>
            <label class="field" style="font-weight: 400; font-size: 0.9rem">Inches<input type="number" min="0" max="11" placeholder="10"></label>
          </div>
        </fieldset>
        <label class="field">Weight (lb)<input type="number" min="50" max="500" placeholder="160"></label>
        <button type="button" class="btn-dark">Save details</button>
      </form>
    </section>
  </div>

  <section class="section" style="width: 100%; max-width: 960px; margin-top: 24px">
    <h2>Saved Try-Ons</h2>
    <div class="tryons">
      <div class="tryon ring">[Try-on 1]</div>
      <div class="tryon ring">[Try-on 2]</div>
      <div class="tryon ring">[Try-on 3]</div>
      <div class="tryon ring">[Try-on 4]</div>
    </div>
  </section>

  <section class="section" style="width: 100%; max-width: 640px; margin-top: 24px">
    <h2>Subscription</h2>
    <div class="panel ring" style="flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 1.125rem; font-weight: 600">[Your plan]</span>
        <span style="font-size: 0.95rem">Renews on [date]</span>
      </div>
      <a href="checkout.html" class="btn-dark">Manage plan</a>
    </div>
  </section>

  <a href="#" class="link-quiet" style="margin-top: 16px">Log out</a>
</main>
</body>
</html>
