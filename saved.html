<!doctype html>
<html lang="en">
<head>
<script>document.documentElement.style.visibility = 'hidden';</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Try-On | Worn</title>
<meta name="description" content="Worn lets you try on clothes before you buy them with an AI rendering on your own body.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,wght@0,400;1,400&family=Inter+Tight:wght@400;500;600&family=Yellowtail&display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#1A1A1A}a:hover{color:#000000}
.profile-tip{position:absolute;top:calc(100% + 8px);right:0;white-space:nowrap;padding:6px 10px;background:#1A1A1A;color:#F6F2EA;font-family:'Inter Tight',system-ui,sans-serif;font-size:0.8rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s,transform .15s;z-index:2}
.profile-btn:hover .profile-tip,.profile-btn:focus-visible .profile-tip{opacity:1;transform:translateY(0)}
.ed-link{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .25s}
.ed-link:hover,.ed-link:focus-visible{background-size:100% 1px}
.ed-btn{transition:background-color .2s,border-color .2s;outline:2px solid transparent;outline-offset:4px}
.ed-btn:hover{background-color:#8A5A2B !important;border-color:#8A5A2B !important}
.ed-btn:focus-visible{outline-color:#1A1A1A}
.ed-plan{transition:border-color .2s,background-color .2s;outline:2px solid transparent;outline-offset:4px}
.ed-plan:hover{border-color:#8A5A2B !important}
.ed-plan:focus-within{outline-color:#1A1A1A}
@media (prefers-reduced-motion: reduce){.ed-link,.ed-btn,.ed-plan{transition:none}}
@media (max-width: 640px){.masthead{grid-template-columns:1fr auto !important;row-gap:0 !important}.masthead .wordmark{grid-column:1 / -1;grid-row:1}}
[hidden]{display:none !important}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #F6F2EA; color: #1A1A1A; font-family: 'Inter Tight', system-ui, sans-serif">

<header style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 16px 32px 0">
<div class="masthead" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; gap: 12px; padding-bottom: 14px">
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 20px">
<a href="index.html" class="ed-link" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #1A1A1A">Home</a>

<a href="tryon.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #8A5A2B; text-decoration: underline; text-underline-offset: 6px">Try On</a>
</nav>
<a href="index.html" aria-label="Worn home" class="wordmark" style="justify-self: center; display: inline-flex; align-items: center; min-height: 44px; color: #1A1A1A; text-decoration: none; font-family: 'Yellowtail', cursive; font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1">Worn</a>
<div style="justify-self: end; display: flex; align-items: center; gap: 16px">
<a href="get-started.html" class="ed-link" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #1A1A1A">Get Started</a>
<a href="profile.html" class="profile-btn" aria-label="My Profile" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #1A1A1A; border-radius: 999px; color: #1A1A1A; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
<span class="profile-tip" aria-hidden="true">My Profile</span>
</a>
</div>
</div>
<div style="border-top: 1px solid #1A1A1A; border-bottom: 1px solid #1A1A1A; height: 3px"></div>
</header>

<main style="max-width: 1100px; margin: 0 auto; box-sizing: border-box; padding: clamp(40px, 6vw, 80px) 32px clamp(64px, 8vw, 112px); display: flex; flex-direction: column; gap: 20px">
<a href="tryon.html" class="ed-link" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5A544C"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4"></path><path d="M10 6l-6 6 6 6"></path></svg> All try-ons</a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<p style="margin: 0; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #8A5A2B">Saved Try-On</p>
<h1 id="look-title" style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: clamp(2.6rem, 6vw, 4.6rem); line-height: 1; letter-spacing: -0.015em">Your <em>Look</em></h1>
<div style="width: 64px; height: 1px; background: #1A1A1A"></div>
<p id="look-meta" style="margin: 0; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #8A5A2B; color: #5A544C; min-height: 1em"></p>
<p id="look-msg" role="status" aria-live="polite" style="margin: 0; min-height: 26px; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.1rem"></p>
</div>

<div id="look-body" hidden style="display: flex; flex-direction: column; gap: clamp(40px, 5vw, 64px)">
<div style="width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(32px, 4vw, 56px); align-items: start">
<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #1A1A1A"><h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: clamp(1.8rem, 3vw, 2.4rem); line-height: 1.1">The Result</h2><span style="font-size: 0.75rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #8A5A2B">No. 01</span></div>
<figure id="result-frame" style="margin: 0; aspect-ratio: 3 / 4; border: 1px solid #1A1A1A; background: #FBF8F2; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; color: #5A544C">Loading…</figure>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a id="download-result" href="#" class="ed-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; box-sizing: border-box; padding: 0 30px; border: 1px solid #1A1A1A; background: #1A1A1A; color: #F6F2EA; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; cursor: pointer">Download</a></div>
</section>
<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #1A1A1A"><h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: clamp(1.8rem, 3vw, 2.4rem); line-height: 1.1">The Piece</h2><span style="font-size: 0.75rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #8A5A2B">No. 02</span></div>
<figure id="garment-frame" style="margin: 0; aspect-ratio: 3 / 4; border: 1px solid #1A1A1A; background: #FBF8F2; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; color: #5A544C">Loading…</figure>
<p id="garment-type" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 0.95rem; color: #5A544C"></p>
</section>
</div>

<section style="display: flex; flex-direction: column; gap: 18px; max-width: 760px; width: 100%; margin: 0 auto">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #1A1A1A"><h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: clamp(1.8rem, 3vw, 2.4rem); line-height: 1.1">Notes</h2><span style="font-size: 0.75rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #8A5A2B">No. 03</span></div>
<label for="notes" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 0.95rem; color: #5A544C; font-size: 1rem">Where did you find it? Paste the link, plus anything worth remembering: size, color, price, store.</label>
<textarea id="notes" maxlength="2000" rows="6" placeholder="e.g. https://store.com/linen-shirt &#10;Size M, sage green, $48. Runs a little big." style="width: 100%; box-sizing: border-box; padding: 16px; border: 1px solid #1A1A1A; background: #FBF8F2; color: #1A1A1A; font-family: 'Source Serif 4', Georgia, serif; font-size: 1.1rem; line-height: 1.6; resize: vertical"></textarea>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<span id="notes-count" style="font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: #5A544C">0 / 2000</span>
<button type="button" id="save-notes" class="ed-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; box-sizing: border-box; padding: 0 30px; border: 1px solid #1A1A1A; background: #1A1A1A; color: #F6F2EA; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; cursor: pointer">Save notes</button>
</div>
<p id="notes-msg" role="status" aria-live="polite" style="margin: 0; min-height: 22px; font-family: 'Source Serif 4', Georgia, serif; font-size: 1rem"></p>
<div id="links-box" hidden style="display: flex; flex-direction: column; gap: 10px; padding-top: 6px">
<p style="margin: 0; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">Links in your notes</p>
<ul id="links" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"></ul>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding-top: 24px; border-top: 1px solid rgba(26, 26, 26, 0.18)">
<a href="tryon.html" class="ed-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; box-sizing: border-box; padding: 0 30px; border: 1px solid #1A1A1A; background: #1A1A1A; color: #F6F2EA; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; cursor: pointer">Try another piece</a>
<button type="button" id="remove-look" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; box-sizing: border-box; padding: 0 22px; border: 1px solid #1A1A1A; background: transparent; color: #1A1A1A; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; cursor: pointer">Remove this try-on</button>
</div>
</div>
</main>

<footer style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 0 32px">
<div style="border-top: 1px solid #1A1A1A; padding: 28px 0 36px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<span style="font-family: 'Yellowtail', cursive; font-size: 2.2rem; line-height: 1">Worn</span>
<span style="font-size: 0.8rem; letter-spacing: 0.16em; text-transform: uppercase; color: #5A544C">Dean Nguyen · © 2026</span>
</div>
</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  // A single saved try-on: result, original clothing photo, and personal notes.
  (async function () {
    var msg = document.getElementById('look-msg');
    var reveal = function () { document.documentElement.style.visibility = ''; };
    if (!window.worn) { reveal(); msg.style.color = '#8A1F14'; msg.textContent = "This page couldn't load (the site's js files are missing). Please try again later."; return; }
    if (!worn.ready) { reveal(); worn.say(msg, worn.notReadyMessage, 'error'); return; }
    var user = await worn.requireUser();
    if (!user) return;
    reveal();

    var db = worn.client, bucket = db.storage.from('try-ons');
    var params = new URLSearchParams(location.search);
    var id = params.get('id') || '';
    if (!/^[0-9a-f-]{36}$/i.test(id)) return worn.say(msg, "We couldn't find that try-on.", 'error');

    var res = await db.from('tryons').select('id,status,category,garment_path,result_path,notes,created_at').eq('id', id).maybeSingle();
    var row = res.data;
    if (!row || row.status !== 'completed' || !row.result_path) return worn.say(msg, "We couldn't find that try-on. It may have been removed.", 'error');

    var when = new Date(row.created_at);
    document.getElementById('look-meta').textContent = when.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) + ' · ' + when.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    var types = { auto: 'Clothing type: detected automatically', tops: 'Clothing type: top', bottoms: 'Clothing type: bottoms', 'one-pieces': 'Clothing type: full outfit' };
    document.getElementById('garment-type').textContent = types[row.category] || '';
    if (params.get('new') === '1') {
      worn.say(msg, 'Here you go! This try-on is saved. Add notes below so you remember where you found it.', 'ok');
      history.replaceState(null, '', 'saved.html?id=' + encodeURIComponent(id));
    }
    document.getElementById('look-body').hidden = false;

    function fill(frameId, url, alt) {
      var fr = document.getElementById(frameId);
      if (!url) { fr.textContent = 'Image unavailable'; return; }
      fr.innerHTML = '';
      var img = document.createElement('img');
      img.src = url; img.alt = alt;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
      fr.appendChild(img);
    }
    var signed = await bucket.createSignedUrls([row.result_path, row.garment_path], 3600);
    var urls = (signed.data || []).map(function (s) { return s && s.signedUrl; });
    fill('result-frame', urls[0], 'You wearing the item (AI try-on)');
    fill('garment-frame', urls[1], 'The clothing item you uploaded');
    var dl = await bucket.createSignedUrl(row.result_path, 3600, { download: 'worn-try-on.png' });
    if (dl.data) document.getElementById('download-result').href = dl.data.signedUrl;

    // ----- Notes -----
    var notes = document.getElementById('notes'), count = document.getElementById('notes-count');
    var notesMsg = document.getElementById('notes-msg'), saveBtn = document.getElementById('save-notes');
    var saved = row.notes || '';
    notes.value = saved;
    function updateCount() {
      count.textContent = notes.value.length + ' / 2000';
      if (notes.value !== saved) worn.say(notesMsg, 'Unsaved changes', 'info'); else if (notesMsg.textContent === 'Unsaved changes') worn.say(notesMsg, '', 'info');
    }
    function renderLinks(text) {
      var list = document.getElementById('links'), box = document.getElementById('links-box');
      var found = (text.match(/https?:\/\/[^\s<>"']+/gi) || []).map(function (u) { return u.replace(/[).,;!?]+$/, ''); });
      var seen = {};
      list.innerHTML = '';
      found.forEach(function (u) {
        if (seen[u]) return; seen[u] = true;
        var parsed; try { parsed = new URL(u); } catch (e) { return; }
        if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return;
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = parsed.href; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
        a.textContent = parsed.hostname.replace(/^www\./, '') + (parsed.pathname.length > 1 ? parsed.pathname.slice(0, 40) + (parsed.pathname.length > 40 ? '…' : '') : '');
        a.style.cssText = "display:inline-flex;align-items:center;min-height:32px;color:#8A5A2B;font-family:'Source Serif 4',Georgia,serif;font-size:1.05rem;text-underline-offset:4px;word-break:break-all";
        li.appendChild(a); list.appendChild(li);
      });
      box.hidden = list.children.length === 0;
    }
    async function saveNotes() {
      var value = notes.value.slice(0, 2000);
      saveBtn.disabled = true; saveBtn.style.opacity = '0.6';
      worn.say(notesMsg, 'Saving…', 'info');
      var up = await db.from('tryons').update({ notes: value.trim() ? value : null }).eq('id', row.id).select('id');
      saveBtn.disabled = false; saveBtn.style.opacity = '';
      if (up.error || !up.data || !up.data.length) return worn.say(notesMsg, "Your notes couldn't be saved. Please try again.", 'error');
      saved = value;
      worn.say(notesMsg, 'Notes saved.', 'ok');
      renderLinks(saved);
    }
    notes.addEventListener('input', updateCount);
    notes.addEventListener('keydown', function (e) { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') saveNotes(); });
    saveBtn.addEventListener('click', saveNotes);
    window.addEventListener('beforeunload', function (e) { if (notes.value !== saved) { e.preventDefault(); e.returnValue = ''; } });
    updateCount(); renderLinks(saved);

    // ----- Remove (two taps, no pop-up) -----
    var removeBtn = document.getElementById('remove-look');
    removeBtn.addEventListener('click', async function () {
      if (!removeBtn.dataset.armed) {
        removeBtn.dataset.armed = '1'; removeBtn.textContent = 'Tap again to remove'; removeBtn.style.color = '#8A1F14'; removeBtn.style.borderColor = '#8A1F14';
        setTimeout(function () { delete removeBtn.dataset.armed; removeBtn.textContent = 'Remove this try-on'; removeBtn.style.color = '#1A1A1A'; removeBtn.style.borderColor = '#1A1A1A'; }, 3000);
        return;
      }
      saved = notes.value;
      await bucket.remove([row.result_path, row.garment_path]);
      await db.from('tryons').delete().eq('id', row.id);
      location.href = 'tryon.html';
    });
  })();
</script>
</body>
</html>
